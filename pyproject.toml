[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "rypipe"
version = "0.1.0"
description = "Format-agnostic data ingestion framework: Rust core with Python bindings. Adapters for XML, JSON, CSV, etc. are separate packages."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Emiliano Gandini", email = "emiliano.gandini@protonmail.com"}
]
requires-python = ">=3.10"
dependencies = ["pyarrow>=15"]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
polars = ["polars>=0.20"]
all = ["rypipe[pandas,polars]"]
dev = [
    "pytest>=7",
    "maturin>=1.4,<2.0",
    "rypipe[all]",
]

[project.urls]
Homepage = "https://github.com/emiliano-go/rypipe"
Repository = "https://github.com/emiliano-go/rypipe"

[tool.maturin]
manifest-path = "crates/rypipe-python/Cargo.toml"
module-name = "_rypipe"
python-source = "."
python-packages = ["_rypipe", "rypipe"]
features = ["pyo3/extension-module"]
profile = "release"
# maturin declares License-File in sdist PKG-INFO but does not add the file
# to the tarball; PyPI rejects the upload unless LICENSE ships explicitly.
include = [{path = "LICENSE", format = "sdist"}]

[tool.pytest.ini_options]
testpaths = ["crates/rypipe-python/tests"]
python_files = ["test_*.py"]
