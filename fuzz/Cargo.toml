[package]
name = "rypipe-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
rypipe-core = { path = "../crates/rypipe-core", features = ["mmap"] }
memchr = "2"
simdutf8 = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("python"))'] }

[[bin]]
name = "fuzz_boundary"
path = "fuzz_targets/fuzz_boundary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_splitter"
path = "fuzz_targets/fuzz_splitter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parser"
path = "fuzz_targets/fuzz_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_validate"
path = "fuzz_targets/fuzz_validate.rs"
test = false
doc = false
bench = false
