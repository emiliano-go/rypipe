[workspace]
members = ["crates/rypipe-core", "crates/rypipe-xml", "crates/rypipe-python"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/emiliano-go/rypipe"
authors = ["Emiliano Gandini <emiliano.gandini@protonmail.com>"]

[workspace.dependencies]
rypipe-core = { path = "crates/rypipe-core" }
rypipe-xml = { path = "crates/rypipe-xml" }
rypipe-python = { path = "crates/rypipe-python" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.profiling]
inherits = "release"
debug = 2
strip = false
panic = "unwind"
