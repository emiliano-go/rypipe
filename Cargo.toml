[workspace]
members = ["crates/rypipe-core", "crates/rypipe-python"]
resolver = "2"

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/emiliano-go/rypipe"
authors = ["Emiliano Gandini <emiliano.gandini@protonmail.com>"]

[workspace.dependencies]
rypipe-core = { path = "crates/rypipe-core" }
rypipe-python = { path = "crates/rypipe-python" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.profiling]
inherits = "release"
debug = 2
strip = false
panic = "unwind"

# S10a: perf profile: thin LTO, fewer codegen units, debug symbols for
# `perf annotate --source`. Creates a third target directory.
[profile.perf]
inherits = "release"
lto = "thin"
codegen-units = 4
debug = 1
strip = "none"
split-debuginfo = "unpacked"
