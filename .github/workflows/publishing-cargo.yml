name: Publish to crates.io

# The trusted publisher registered on crates.io is bound to this workflow
# filename and the `cargo` environment below. Renaming either breaks OIDC.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Test workspace
        run: cargo test --workspace --all-features

  publish:
    name: Publish rypipe-core
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: cargo
      url: https://crates.io/crates/rypipe-core
    permissions:
      # Required to mint the GitHub OIDC token that crates.io exchanges for a
      # short-lived publish token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Verify the package builds from its packaged tarball
        run: cargo publish --dry-run -p rypipe-core

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@82864bf380abd3e242c564a5ba58dd29d6265b00 # v1
        id: auth

      - name: Publish rypipe-core
        run: bash scripts/publish-crate.sh rypipe-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-python:
    name: Publish rypipe-python
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: cargo
      url: https://crates.io/crates/rypipe-python
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # A crate must exist on crates.io before a trusted publisher can be
      # configured for it, so the first version is published manually. Detect
      # that case here and skip the OIDC exchange (which would otherwise fail
      # with no trusted publisher configured) and the publish step.
      - name: Check whether this version is already published
        id: check
        run: |
          version="$(grep -m1 '^version' crates/rypipe-python/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          code="$(curl -s -o /dev/null -w '%{http_code}' -H 'User-Agent: rypipe-release' "https://crates.io/api/v1/crates/rypipe-python/${version}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::rypipe-python ${version} is already published; skipping"
          fi

      - name: Authenticate with crates.io
        if: steps.check.outputs.published != 'true'
        uses: rust-lang/crates-io-auth-action@82864bf380abd3e242c564a5ba58dd29d6265b00 # v1
        id: auth

      # rypipe-python depends on rypipe-core by version. The core job runs
      # first, and cargo blocks until a published crate is indexed, so the
      # dependency resolves by the time this step runs.
      - name: Publish rypipe-python
        if: steps.check.outputs.published != 'true'
        run: bash scripts/publish-crate.sh rypipe-python
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
