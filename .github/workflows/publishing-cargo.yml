name: Publish to crates.io

# The trusted publisher registered on crates.io is bound to this workflow
# filename and the `cargo` environment below. Renaming either breaks OIDC.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@544eadc6bf3d226fd7a7a9f0dc5b5bf7ca0675b9 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Test workspace
        run: cargo test --workspace --all-features

  publish:
    name: Publish rypipe-core
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: cargo
      url: https://crates.io/crates/rypipe-core
    permissions:
      # Required to mint the GitHub OIDC token that crates.io exchanges for a
      # short-lived publish token.
      id-token: write
    steps:
      - uses: actions/checkout@544eadc6bf3d226fd7a7a9f0dc5b5bf7ca0675b9 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Verify the package builds from its packaged tarball
        run: cargo publish --dry-run -p rypipe-core

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@82864bf380abd3e242c564a5ba58dd29d6265b00 # v1
        id: auth

      - name: Publish rypipe-core
        run: cargo publish -p rypipe-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
