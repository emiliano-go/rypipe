name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@544eadc6bf3d226fd7a7a9f0dc5b5bf7ca0675b9 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Test workspace
        run: cargo test --workspace --all-features

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.13"

      - name: Install Python build tools
        run: pip install maturin pytest pyarrow pandas polars

      - name: Build Python extension
        run: maturin build --release --manifest-path crates/rypipe-python/Cargo.toml

      - name: Run Python tests
        run: |
          pip install target/wheels/*.whl
          pytest crates/rypipe-python/tests/

  # The extension is built against the stable ABI (abi3-py310), so a single
  # wheel per platform covers CPython 3.10 and every later version.
  linux:
    name: Wheel (${{ matrix.platform }} ${{ matrix.target }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux2014 pins the glibc floor at 2.17, so the wheels install
          # on Debian 11, Ubuntu 20.04, RHEL 8 and Amazon Linux 2. Building on
          # the runner directly would emit manylinux_2_34 and exclude them.
          - target: x86_64
            platform: manylinux
            manylinux: "2014"
          # Zig's bundled clang cross-compiles against old glibc, keeping the
          # 2.17 floor without an emulated manylinux2014_aarch64 container.
          - target: aarch64
            platform: manylinux
            manylinux: "2014"
            zig: true
          - target: x86_64
            platform: musllinux
            manylinux: musllinux_1_2
          - target: aarch64
            platform: musllinux
            manylinux: musllinux_1_2
    steps:
      - uses: actions/checkout@544eadc6bf3d226fd7a7a9f0dc5b5bf7ca0675b9 # v4

      - name: Build wheel
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist ${{ matrix.zig && '--zig' || '' }}
          sccache: "true"

      - name: Upload wheel
        uses: actions/upload-artifact@34622df80861c3ed63eb2bff892de2f1fbf4c9da # v7
        with:
          name: wheels-${{ matrix.platform }}-${{ matrix.target }}
          path: dist/

  macos:
    name: Wheel (macOS ${{ matrix.target }})
    needs: test
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@544eadc6bf3d226fd7a7a9f0dc5b5bf7ca0675b9 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.13"

      - name: Build wheel
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"

      - name: Upload wheel
        uses: actions/upload-artifact@34622df80861c3ed63eb2bff892de2f1fbf4c9da # v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/

  windows:
    name: Wheel (Windows ${{ matrix.target }})
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@544eadc6bf3d226fd7a7a9f0dc5b5bf7ca0675b9 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.target }}

      - name: Build wheel
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"

      - name: Upload wheel
        uses: actions/upload-artifact@34622df80861c3ed63eb2bff892de2f1fbf4c9da # v7
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist/

  sdist:
    name: Source distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@544eadc6bf3d226fd7a7a9f0dc5b5bf7ca0675b9 # v4

      - name: Build sdist
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@34622df80861c3ed63eb2bff892de2f1fbf4c9da # v7
        with:
          name: wheels-sdist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [linux, macos, windows, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rypipe
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@fdafc3f9f2e2a522dc1d230e6a03de57a1e71c95 # v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: List distributions
        run: ls -l dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # Wheel filenames for an already-published version are burned on
          # PyPI; retries (e.g. after fixing a rejected sdist) must skip them.
          skip-existing: true
