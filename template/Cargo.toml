[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "{{description}}"

[lib]
name = "_{{crate_name}}"
crate-type = ["cdylib", "rlib"]

[dependencies]
rypipe-core = { version = "0.3.2", features = ["mmap"] }
rypipe_python = { package = "rypipe-python", version = "0.3.2" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
memchr = "2"
simdutf8 = "0.1"
