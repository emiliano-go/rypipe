[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "{{project-name}}"
version = "0.1.0"
description = "{{description}}"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["rypipe>=0.3.2", "pyarrow>=15"]

[project.optional-dependencies]
dev = ["pytest>=7", "maturin>=1.4,<2.0"]
pandas = ["pandas>=1.5"]

[tool.maturin]
module-name = "{{crate_name}}._{{crate_name}}"
python-source = "."
features = ["pyo3/extension-module"]
