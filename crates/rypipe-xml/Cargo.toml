[package]
name = "rypipe-xml"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Crystal Reports XML adapter for the rypipe-core columnar engine"
repository = "https://github.com/emiliano-go/rypipe"
authors = ["Emiliano Gandini <emiliano.gandini@protonmail.com>"]

[dependencies]
rypipe-core = { path = "../rypipe-core" }
quick-xml = "0.41"
memchr = "2"
simdutf8 = "0.1"
rustc-hash = "2"
thiserror = "2"

[dev-dependencies]
rypipe-core = { path = "../rypipe-core" }
arrow = { version = "=55.2.0", default-features = false }
