[package]
name = "rypipe-python"
version = "0.5.1"
edition = "2021"
license = "MIT"
description = "PyO3 bindings over the rypipe-core ingestion framework"
repository = "https://github.com/emiliano-go/rypipe"
homepage = "https://rypipe.emiliano-go.com"
documentation = "https://rypipe.emiliano-go.com/rust-api/"
readme = "README.md"
keywords = ["pyo3", "arrow", "python", "parser", "ingestion"]
categories = ["api-bindings", "parser-implementations", "encoding"]
authors = ["Emiliano Gandini <emiliano.gandini@protonmail.com>"]

[lib]
name = "_rypipe"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
# Keep Arrow aligned with rypipe-core so downstream adapter crates share one
# Arrow ABI and can reuse export helpers directly.
arrow = { version = "60.0", default-features = false, features = ["pyarrow", "ffi"] }
rypipe-core = { path = "../rypipe-core", version = "0.5.1", features = ["compress-all"] }
mimalloc = { version = "0.1", default-features = false }
