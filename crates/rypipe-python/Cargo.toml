[package]
name = "rypipe-python"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "PyO3 bindings over the rypipe-core columnar engine"
repository = "https://github.com/emiliano-go/rypipe"
authors = ["Emiliano Gandini <emiliano.gandini@protonmail.com>"]

[lib]
name = "_rypipe"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py310"] }
arrow = { version = "=59.2.0", default-features = false, features = ["pyarrow", "ffi"] }
rypipe-core = { path = "../rypipe-core" }
mimalloc = { version = "0.1", default-features = false }
