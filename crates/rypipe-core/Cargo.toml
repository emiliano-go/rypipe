[package]
name = "rypipe-core"
version = "2.2.0"
edition = "2021"
license = "MIT"
description = "Format-agnostic ingestion framework with Arrow export"
repository = "https://github.com/emiliano-go/rypipe"
homepage = "https://rypipe.emiliano-go.com"
documentation = "https://docs.rs/rypipe-core"
readme = "README.md"
keywords = ["arrow", "columnar", "parser", "ingestion", "etl"]
categories = ["parser-implementations", "encoding", "data-structures"]
authors = ["Emiliano Gandini <emiliano.gandini@protonmail.com>"]

[features]
default = []
mmap = ["dep:memmap2"]
mimalloc = ["dep:mimalloc"]
# Transparently decompress inputs whose leading magic bytes identify them.
# Detection happens in `InputBuffer::open`; decompressed bytes are served
# from memory (`InputBuffer::Owned`) across all execution modes.
gzip = ["dep:flate2"]
zstd = ["dep:zstd"]
lz4 = ["dep:lz4_flex"]
compress-all = ["gzip", "zstd", "lz4"]
alloc-stats = []
# Tier ladder for cost decomposition (bench module).
bench = []
# Alias for crxml's "profile" feature: activates the same profiling counters
# in engine.rs that the "profiling" feature does.
profile = []

[dependencies]
arrow = { version = "=55.2.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
rayon = "1"
memchr = "2"
simdutf8 = "0.1"
lexical = "7"
rustc-hash = "2"
thiserror = "2"
smallvec = "1"
memmap2 = { version = "0.9", optional = true }
flate2 = { version = "1", optional = true, default-features = false, features = ["rust_backend"] }
zstd = { version = "0.13", optional = true }
lz4_flex = { version = "0.14", optional = true }
mimalloc = { version = "0.1", optional = true, default-features = false }

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
