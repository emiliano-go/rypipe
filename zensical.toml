[project]
site_name = "rypipe"
site_description = "Format-agnostic columnar ingestion engine. Rust core, Python bindings, parallel scheduling, memory-bounded execution, and Arrow export."
site_url = "https://rypipe.emiliano-go.com/"
docs_dir = "docs"
site_dir = "site"

copyright = "&copy; 2026 Emiliano Gandini Outeda"

extra_css = ["stylesheets/extra.css"]

[project.theme]
variant = "modern"
custom_dir = "docs/overrides"
font.text = "Ubuntu"
font.code = "JetBrains Mono"
features = [
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.tabs",
    "navigation.indexes",
    "navigation.top",
    "navigation.footer",
    "search.suggest",
    "search.highlight",
    "content.code.copy",
    "content.code.annotate",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/emiliano-go/rypipe"
name = "rypipe on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/rypipe/"
name = "rypipe on PyPI"

[[project.nav]]
"Home" = "index.md"

[[project.nav]]
"Python API" = "python-api.md"

[[project.nav]]
"Rust Core" = "rust-api.md"

[[project.nav]]
"Writing Adapters" = [
    "writing-adapters/index.md",
    { "Quick start" = "writing-adapters/quickstart.md" },
    { "Python wiring" = "writing-adapters/python-wiring.md" },
    { "Rust creation" = "writing-adapters/rust-creation.md" },
    { "Schema" = "writing-adapters/schema.md" },
    { "Techniques" = "writing-adapters/techniques.md" },
    { "Anti-patterns" = "writing-adapters/anti-patterns.md" },
    { "Splitter" = "writing-adapters/splitter.md" },
    { "Parser" = "writing-adapters/parser.md" },
    { "Sink" = "writing-adapters/sink.md" },
    { "Scan primitives" = "writing-adapters/scan.md" },
    { "Skip regions" = "writing-adapters/skip-regions.md" },
    { "Chunk planning" = "writing-adapters/chunk-planning.md" },
    { "Examples" = "writing-adapters/examples.md" },
]

[[project.nav]]
"Examples" = "examples.md"

[[project.nav]]
"Advanced" = [
    "advanced/index.md",
    { "Pushdown fusion" = "advanced/fusion.md" },
    { "Execution modes" = "advanced/execution-modes.md" },
    { "Memory and chunking" = "advanced/memory-and-chunking.md" },
    { "Parallelism" = "advanced/parallelism.md" },
    { "Dictionary encoding" = "advanced/dictionary-encoding.md" },
    { "Schema and types" = "advanced/schema-and-types.md" },
    { "I/O tuning" = "advanced/io-tuning.md" },
    { "Adapter design" = "advanced/adapter-design.md" },
    { "Profiling" = "advanced/profiling.md" },
    { "Anti-patterns" = "advanced/anti-patterns.md" },
    { "Case study: crxml" = "advanced/case-study-crxml.md" },
]

[[project.nav]]
"crxml Adapter" = "crxml-adapter.md"

[[project.nav]]
"Architecture" = [
    "architecture/index.md",
    { "Engine" = "architecture/engine.md" },
    { "Columnar storage" = "architecture/columnar.md" },
    { "Execution plan" = "architecture/plan.md" },
    { "Decoder API" = "architecture/decoder.md" },
    { "Execution" = "architecture/execution.md" },
    { "Data flow" = "architecture/data-flow.md" },
    { "Storage and export" = "architecture/storage.md" },
    { "Schema" = "architecture/schema.md" },
    { "Optimizations" = "architecture/optimizations.md" },
]

[[project.nav]]
"Why Python?" = "why-python.md"

[[project.nav]]
"Performance" = "performance.md"

[project.markdown_extensions]
"seoslug.contrib.zensical" = {
  canonical_host = "rypipe.emiliano-go.com",
  public_base_url = "https://rypipe.emiliano-go.com/",
  site_name = "rypipe",
  title_template = "{title} - rypipe",
  publisher_name = "Emiliano Gandini Outeda",
  locale = "en_US",
  twitter_site = "@emiliano_go_",
  auto_generate_schema = true,
}

[project.markdown_extensions.tables]

[project.markdown_extensions.admonition]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]
